<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Shared board</title>
<style>
  :root{
    --bg:#111214; --bg2:#18191c; --bg3:#202125; --bg4:#2a2b30;
    --border:#2c2d32; --border2:#3a3b41;
    --text:#ececec; --text2:#b4b5ba; --text3:#7d7e85;
    --accent:#4cbfc9; --blue:#6ea0e0; --red:#e06a6a; --amber:#e0b04c;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  a{color:var(--blue)}
  button{font:inherit;color:inherit}

  /* Header */
  #hdr{position:sticky;top:0;z-index:20;background:rgba(17,18,20,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
       border-bottom:1px solid var(--border);padding:calc(10px + var(--safe-t)) 16px 10px}
  #hdr .row1{display:flex;align-items:flex-start;gap:10px}
  #hdr h1{font-size:18px;line-height:1.25;margin:0;font-weight:650;flex:1;min-width:0;overflow-wrap:anywhere}
  #hdr .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--text3);margin-top:3px}
  #refresh{flex-shrink:0;width:36px;height:36px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer}
  #refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .seg{display:flex;margin-top:10px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}
  .seg button.on{background:var(--bg4);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
  #jump{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
  #jump::-webkit-scrollbar{display:none}
  #jump button{flex-shrink:0;border:1px solid var(--border2);background:var(--bg2);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--text2);cursor:pointer;white-space:nowrap}

  .banner{margin:12px 16px 0;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4;border:1px solid}
  .banner.warn{background:rgba(224,176,76,.08);border-color:rgba(224,176,76,.35);color:var(--amber)}

  main{padding:4px 16px calc(40px + var(--safe-b));max-width:720px;margin:0 auto}

  /* Sections view */
  .section{padding-top:18px;scroll-margin-top:var(--hdr-h,140px)}
  .section>h2{font-size:12px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
  .section>h2::after{content:"";flex:1;height:1px;background:var(--border)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;overflow-wrap:anywhere}
  .note-title{font-weight:650;font-size:15.5px;margin-bottom:4px}
  .rich{color:var(--text2);font-size:14.5px}
  .rich p,.rich div{margin:0}
  .rich ul,.rich ol{margin:4px 0;padding-left:22px}
  .h-item{font-size:20px;font-weight:700;line-height:1.25;margin:6px 0 0;overflow-wrap:anywhere}
  .text-item{color:var(--text2);font-size:14.5px;padding:0 2px;overflow-wrap:anywhere}
  .img-item{margin:0;border-radius:12px;overflow:hidden;background:var(--bg3);border:1px solid var(--border)}
  .img-item img{display:block;width:100%;height:auto;cursor:zoom-in}
  .img-item figcaption{padding:8px 12px;font-size:13px;color:var(--text2)}
  .img-missing{padding:28px;text-align:center;color:var(--text3);font-size:13px}
  .link-item{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:12px 14px;min-height:60px}
  .link-item:active{background:var(--bg3)}
  .link-ico{width:36px;height:36px;border-radius:9px;background:rgba(110,160,224,.12);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .link-txt{flex:1;min-width:0}
  .link-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link-host{font-family:var(--mono);font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link-go{color:var(--blue);font-size:18px;flex-shrink:0}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .swatch{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer}
  .swatch i{width:28px;height:28px;border-radius:7px;display:block;border:1px solid rgba(255,255,255,.08)}
  .swatch span{font-family:var(--mono);font-size:12px;color:var(--text2)}
  .empty{color:var(--text3);text-align:center;padding:48px 12px;font-size:14px;line-height:1.6}

  /* Storyboard view */
  .shot{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .shot-hd{display:flex;align-items:center;gap:10px;padding:9px 12px}
  .shot-n{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--bg);background:var(--accent);border-radius:6px;min-width:26px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .shot-cap{font-size:14px;color:var(--text);font-weight:500;overflow-wrap:anywhere}
  .shot img{display:block;width:100%;height:auto;cursor:zoom-in;background:var(--bg3)}

  /* Canvas view */
  #canvas{position:fixed;left:0;right:0;bottom:0;overflow:hidden;touch-action:none;background:
     radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/22px 22px,var(--bg)}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  .ci{position:absolute;overflow:hidden;border-radius:8px}
  .ci.note{background:var(--bg2);border:1px solid var(--border);padding:10px 12px}
  .ci.frame{border:1.5px dashed var(--border2);border-radius:10px;overflow:visible}
  .ci.frame .fl{position:absolute;top:-22px;left:2px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);white-space:nowrap}
  .ci.image{background:var(--bg3)} .ci.image img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .ci.link{background:var(--bg2);border:1px solid var(--border2);display:flex;flex-direction:column;justify-content:center;padding:10px 12px;cursor:pointer}
  .ci.swatch{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--border)}
  .ci.swatch i{flex:1;display:block} .ci.swatch span{font-family:var(--mono);font-size:11px;padding:4px 6px;color:var(--text2)}
  .ci.heading{font-weight:700;display:flex;align-items:center;overflow:visible;white-space:nowrap}
  .ci.text{color:var(--text2);overflow:visible}
  #zoombar{position:fixed;right:12px;bottom:calc(14px + var(--safe-b));display:flex;gap:6px;z-index:15}
  #zoombar button{width:44px;height:44px;border-radius:12px;border:1px solid var(--border2);background:rgba(32,33,37,.95);font-size:18px;font-weight:600;cursor:pointer}
  #zoombar button.fit{width:auto;padding:0 14px;font-size:13px}

  /* Lightbox */
  #lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:none;flex-direction:column}
  #lb.open{display:flex}
  #lb .lb-bar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;color:var(--text2);font-size:13px}
  #lb .lb-bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #lb .lb-bar button,#lb .lb-bar a{border:1px solid var(--border2);background:var(--bg3);border-radius:9px;padding:7px 12px;font-size:13px;text-decoration:none;color:var(--text);cursor:pointer}
  #lb .lb-img{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
  #lb img{max-width:100%;max-height:100%;object-fit:contain}

  /* States */
  .state{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--text2)}
  .state h2{color:var(--text);font-size:19px;margin:12px 0 6px}
  .state p{margin:0;max-width:340px;line-height:1.55;font-size:14.5px}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border2);border-top-color:var(--accent);animation:spin .8s linear infinite}
  #toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;display:none}
  .foot{margin-top:28px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--text3);letter-spacing:.04em}
</style>
</head>
<body>
<div id="app"><div class="state"><div class="spinner"></div><p style="margin-top:14px">Loading board…</p></div></div>
<div id="lb" role="dialog" aria-modal="true">
  <div class="lb-bar"><span id="lb-cap"></span><a id="lb-open" target="_blank" rel="noopener noreferrer">Open</a><button onclick="closeLightbox()">Close</button></div>
  <div class="lb-img" onclick="if(event.target===this)closeLightbox()"><img id="lb-img" alt=""></div>
</div>
<div id="toast"></div>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// Shared board viewer. Read-only. Loads /api/public/boards/<token>.
// ─────────────────────────────────────────────────────────────────────────────
const TOKEN = (location.pathname.match(/\/b\/([A-Za-z0-9_-]+)/) || [])[1] || '';
const CACHE_KEY = 'sharedBoard:' + TOKEN;
const VIEW_KEY = 'sharedBoardView:' + TOKEN;
let DATA = null, VIEW = null, FROM_CACHE = false, LOAD_ERR = null;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){
  try{ const x=new URL(String(u||''), location.href); return ['http:','https:','mailto:','tel:'].includes(x.protocol)?x.href:null; }catch(e){ return null; }
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(c||'')?c:null; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2000); }

// Rich text from the board editor → safe HTML. Allow-list only; every attribute
// is dropped except a vetted href on links.
const ALLOWED = new Set(['B','STRONG','I','EM','U','S','STRIKE','BR','P','DIV','SPAN','UL','OL','LI','A','H1','H2','H3','H4','BLOCKQUOTE','CODE','PRE','SUB','SUP','HR']);
function sanitize(html){
  if(!html) return '';
  const doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  (function walk(node){
    [...node.childNodes].forEach(n=>{
      if(n.nodeType===3) return;
      if(n.nodeType!==1){ n.remove(); return; }
      if(!ALLOWED.has(n.tagName)){
        if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','SVG','MATH','NOSCRIPT','LINK','META'].includes(n.tagName)){ n.remove(); return; }
        walk(n); n.replaceWith(...n.childNodes); return;
      }
      const href=n.tagName==='A'?safeUrl(n.getAttribute('href')):null;
      [...n.attributes].forEach(a=>n.removeAttribute(a.name));
      if(n.tagName==='A'){ if(href){ n.setAttribute('href',href); n.setAttribute('target','_blank'); n.setAttribute('rel','noopener noreferrer'); } }
      walk(n);
    });
  })(doc.body);
  return doc.body.innerHTML;
}
function plain(s){ // title fields are plain text but may carry stray markup from contentEditable
  if(!s) return '';
  const d=new DOMParser().parseFromString('<body>'+s+'</body>','text/html'); return d.body.textContent||'';
}

function ago(iso){
  const s=(Date.now()-new Date(iso).getTime())/1000; if(!isFinite(s)) return '';
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago';
  const d=Math.floor(s/86400); return d<30?d+'d ago':new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

// ── Reading order: top-to-bottom rows, left-to-right within a row ──
function readingOrder(items){
  const arr=[...items].sort((a,b)=>a.y-b.y||a.x-b.x);
  const rows=[];
  arr.forEach(it=>{
    const r=rows[rows.length-1];
    // Join the current row if this item starts above the row's vertical midpoint.
    if(r && it.y < r.top + Math.max(24, r.minH*0.5)){ r.items.push(it); r.minH=Math.min(r.minH,it.h||0); }
    else rows.push({top:it.y,minH:it.h||0,items:[it]});
  });
  return rows.flatMap(r=>r.items.sort((a,b)=>a.x-b.x));
}

// ── Sections: each Frame is a section; loose items group under the nearest Heading ──
function buildSections(items){
  const frames=items.filter(i=>i.itemType==='frame');
  const contains=(f,it)=>{ const cx=it.x+it.w/2, cy=it.y+it.h/2; return cx>=f.x&&cx<=f.x+f.w&&cy>=f.y&&cy<=f.y+f.h; };
  const inFrame=new Map(frames.map(f=>[f.id,[]]));
  const loose=[];
  items.forEach(it=>{
    if(it.itemType==='frame') return;
    // Smallest frame whose box holds the item's centre wins (handles nested frames)
    let best=null;
    frames.forEach(f=>{ if(contains(f,it) && (!best || f.w*f.h < best.w*best.h)) best=f; });
    if(best) inFrame.get(best.id).push(it); else loose.push(it);
  });
  // A frame drawn inside another frame becomes its own section, read in canvas order
  const top=[...frames,...loose];
  const out=[]; let cur=null;
  readingOrder(top).forEach(it=>{
    if(it.itemType==='frame'){
      out.push({title:plain(it.title)||'Untitled section', items:readingOrder(inFrame.get(it.id)), frame:true});
      cur=null;
    } else if(it.itemType==='heading'){
      cur={title:plain(it.title)||'Section', items:[]}; out.push(cur);
    } else {
      if(!cur){ cur={title:'', items:[]}; out.push(cur); }
      cur.items.push(it);
    }
  });
  return out.filter(s=>s.items.length||s.frame);
}

// ── Item renderers (Sections view) ──
const LINK_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 007 0l2-2a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-2 2a5 5 0 007 7l1-1"/></svg>';
function renderItem(it){
  switch(it.itemType){
    case 'note':{
      const c=safeColor(it.color);
      const style=c?` style="background:${c}1f;border-color:${c}66"`:'';
      const t=plain(it.title), b=sanitize(it.body);
      if(!t && !b.trim()) return '';
      return `<div class="card"${style}>${t?`<div class="note-title">${esc(t)}</div>`:''}${b?`<div class="rich">${b}</div>`:''}</div>`;
    }
    case 'heading': return `<div class="h-item"${safeColor(it.color)?` style="color:${it.color}"`:''}>${esc(plain(it.title))}</div>`;
    case 'text':{ const b=sanitize(it.body); return b.trim()?`<div class="text-item rich">${b}</div>`:''; }
    case 'image':{
      if(!it.imageUrl) return `<figure class="img-item"><div class="img-missing">Image unavailable</div></figure>`;
      const ratio=(it.imageW&&it.imageH)?` style="aspect-ratio:${it.imageW}/${it.imageH}"`:'';
      const cap=plain(it.title);
      return `<figure class="img-item"><img src="${esc(it.imageUrl)}" alt="${esc(cap)}" loading="lazy"${ratio} data-lb="${esc(it.id)}">${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`;
    }
    case 'link':{
      const u=safeUrl(it.url); if(!u) return '';
      const host=hostOf(u);
      return `<a class="link-item" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><span class="link-ico">${LINK_ICON}</span>
        <span class="link-txt"><span class="link-title" style="display:block">${esc(plain(it.title)||host||u)}</span><span class="link-host" style="display:block">${esc(host)}</span></span><span class="link-go">↗</span></a>`;
    }
    case 'swatch':{ const c=safeColor(it.color)||'#4cbfc9'; return `<div class="swatch" data-copy="${esc(c.toUpperCase())}"><i style="background:${c}"></i><span>${esc(c.toUpperCase())}</span></div>`; }
    default: return '';
  }
}
function renderStack(items){
  // Consecutive swatches sit together in one wrapping row
  let html='', sw='';
  items.forEach(it=>{
    if(it.itemType==='swatch'){ sw+=renderItem(it); return; }
    if(sw){ html+=`<div class="swatches">${sw}</div>`; sw=''; }
    html+=renderItem(it);
  });
  if(sw) html+=`<div class="swatches">${sw}</div>`;
  return html;
}

function viewSections(){
  const secs=buildSections(DATA.items);
  if(!secs.length) return {html:`<div class="empty">This board is empty.</div>`, jump:[]};
  const jump=[];
  const html=secs.map((s,i)=>{
    const id='s'+i; if(s.title) jump.push({id,title:s.title});
    return `<section class="section" id="${id}">${s.title?`<h2>${esc(s.title)}</h2>`:''}<div class="stack">${renderStack(s.items)||'<div class="text-item" style="color:var(--text3)">Nothing in this section yet.</div>'}</div></section>`;
  }).join('');
  return {html, jump: jump.length>1?jump:[]};
}

function storyboardItems(){
  return DATA.items.filter(i=>i.itemType==='image'||i.seqOrder!=null)
    .sort((a,b)=>((a.seqOrder!=null?a.seqOrder:9999)-(b.seqOrder!=null?b.seqOrder:9999))||(a.createdAt<b.createdAt?-1:1));
}
function viewStoryboard(){
  const seq=storyboardItems();
  if(!seq.length) return {html:`<div class="empty">No storyboard frames on this board.<br>Try the Sections view.</div>`, jump:[]};
  return {html:`<div class="stack" style="padding-top:16px">${seq.map((it,i)=>{
    const cap=plain(it.title);
    const img=it.imageUrl?`<img src="${esc(it.imageUrl)}" alt="${esc(cap)}" loading="lazy"${(it.imageW&&it.imageH)?` style="aspect-ratio:${it.imageW}/${it.imageH}"`:''} data-lb="${esc(it.id)}">`:(it.itemType==='image'?'<div class="img-missing">Image unavailable</div>':'');
    const body=it.itemType!=='image'&&it.body?`<div class="rich" style="padding:0 12px 12px">${sanitize(it.body)}</div>`:'';
    return `<div class="shot"><div class="shot-hd"><span class="shot-n">${i+1}</span><span class="shot-cap">${esc(cap||(it.itemType==='image'?'':'Frame '+(i+1)))}</span></div>${img}${body}</div>`;
  }).join('')}</div>`, jump:[]};
}

// ── Canvas view: the original layout, drag to pan, pinch to zoom ──
const cam={x:0,y:0,z:1};
function canvasItemHtml(it){
  const pos=`left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;z-index:${it.itemType==='frame'?0:(it.z||0)+1}`;
  const c=safeColor(it.color);
  switch(it.itemType){
    case 'frame': return `<div class="ci frame" style="${pos};${c?`border-color:${c}`:''}"><div class="fl">${esc(plain(it.title))}</div></div>`;
    case 'note': return `<div class="ci note" style="${pos};${c?`background:${c}22;border-color:${c}`:''};font-size:${(it.fontSize||14)-1}px"><div style="font-weight:650;font-size:${(it.fontSize||14)+1}px">${esc(plain(it.title))}</div><div class="rich" style="font-size:inherit">${sanitize(it.body)}</div></div>`;
    case 'heading': return `<div class="ci heading" style="${pos};font-size:${it.fontSize||28}px;${c?`color:${c}`:''}">${esc(plain(it.title))}</div>`;
    case 'text': return `<div class="ci text" style="${pos};font-size:${it.fontSize||13}px;${c?`color:${c}`:''}">${sanitize(it.body)}</div>`;
    case 'image': return `<div class="ci image" style="${pos}" data-lb="${esc(it.id)}">${it.imageUrl?`<img src="${esc(it.imageUrl)}" alt="">`:''}</div>`;
    case 'link':{ const u=safeUrl(it.url); const h=hostOf(u||''); return `<div class="ci link" style="${pos}" data-href="${esc(u||'')}"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(plain(it.title)||h||'Link')}</div><div style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(h)}</div><div style="color:var(--blue);font-size:11px;margin-top:6px">Open ↗</div></div>`; }
    case 'swatch':{ const s=c||'#4cbfc9'; return `<div class="ci swatch" style="${pos}"><i style="background:${s}"></i><span>${esc(s.toUpperCase())}</span></div>`; }
    default: return '';
  }
}
function viewCanvas(){
  return {html:`<div id="canvas"><div id="world">${DATA.items.map(canvasItemHtml).join('')}</div></div>
    <div id="zoombar"><button onclick="zoomBy(0.8)" aria-label="Zoom out">−</button><button onclick="zoomBy(1.25)" aria-label="Zoom in">+</button><button class="fit" onclick="fitCanvas()">Fit</button></div>`, jump:[], canvas:true};
}
function applyCam(){ const w=document.getElementById('world'); if(w) w.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`; }
function fitCanvas(){
  const el=document.getElementById('canvas'); if(!el||!DATA.items.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  DATA.items.forEach(i=>{ x0=Math.min(x0,i.x); y0=Math.min(y0,i.y-(i.itemType==='frame'?24:0)); x1=Math.max(x1,i.x+i.w); y1=Math.max(y1,i.y+i.h); });
  const W=el.clientWidth, H=el.clientHeight, pad=20;
  cam.z=Math.min(2,Math.max(0.05,Math.min((W-pad*2)/(x1-x0),(H-pad*2)/(y1-y0))));
  cam.x=(W-(x1-x0)*cam.z)/2-x0*cam.z; cam.y=(H-(y1-y0)*cam.z)/2-y0*cam.z; applyCam();
}
function zoomBy(f,cx,cy){
  const el=document.getElementById('canvas'); if(!el) return;
  if(cx==null){ cx=el.clientWidth/2; cy=el.clientHeight/2; }
  const nz=Math.min(4,Math.max(0.05,cam.z*f)); const k=nz/cam.z;
  cam.x=cx-(cx-cam.x)*k; cam.y=cy-(cy-cam.y)*k; cam.z=nz; applyCam();
}
function wireCanvas(){
  const el=document.getElementById('canvas');
  const hdr=document.getElementById('hdr'); el.style.top=hdr.getBoundingClientRect().bottom+'px';
  const pts=new Map(); let last=null, moved=0, downTarget=null;
  const rect=()=>el.getBoundingClientRect();
  el.addEventListener('pointerdown',e=>{ el.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; downTarget=e.target; last=null; });
  el.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ cam.x+=e.clientX-prev.x; cam.y+=e.clientY-prev.y; moved+=Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y); applyCam(); }
    else if(pts.size===2){
      const [a,b]=[...pts.values()]; const r=rect();
      const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
      if(last){ cam.x+=mx-last.mx; cam.y+=my-last.my; zoomBy(d/last.d,mx,my); }
      last={d,mx,my}; moved+=99;
    }
  });
  const end=e=>{
    if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); last=null;
    if(pts.size===0 && moved<8 && downTarget){
      const link=downTarget.closest('[data-href]'); if(link&&link.dataset.href){ window.open(link.dataset.href,'_blank','noopener'); return; }
      const img=downTarget.closest('[data-lb]'); if(img) openLightbox(img.dataset.lb);
    }
  };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{ e.preventDefault(); const r=rect(); if(e.ctrlKey) zoomBy(Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top); else { cam.x-=e.deltaX; cam.y-=e.deltaY; applyCam(); } },{passive:false});
  fitCanvas();
}

// ── Lightbox ──
function openLightbox(id){
  const it=DATA.items.find(i=>i.id===id); if(!it||!it.imageUrl) return;
  document.getElementById('lb-img').src=it.imageUrl;
  document.getElementById('lb-cap').textContent=plain(it.title)||'';
  document.getElementById('lb-open').href=it.imageUrl;
  document.getElementById('lb').classList.add('open');
  history.pushState({lb:1},'');
}
function closeLightbox(){ if(document.getElementById('lb').classList.contains('open')){ document.getElementById('lb').classList.remove('open'); if(history.state&&history.state.lb) history.back(); } }
window.addEventListener('popstate',()=>document.getElementById('lb').classList.remove('open'));

// ── Page shell ──
function pickDefaultView(){
  const saved=lsGet(VIEW_KEY); if(['sections','storyboard','canvas'].includes(saved)) return saved;
  // A board whose owner set Storyboard as its default opens there, everything else opens in Sections
  return (DATA.board.defaultView==='sequence' && storyboardItems().length) ? 'storyboard' : 'sections';
}
function setView(v){ VIEW=v; lsSet(VIEW_KEY,v); render(); window.scrollTo(0,0); }

function render(){
  const app=document.getElementById('app');
  if(!DATA){
    const e=LOAD_ERR||{};
    app.innerHTML=`<div class="state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="1.6"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <h2>${esc(e.title||'Board unavailable')}</h2><p>${esc(e.message||'This link could not be opened.')}</p>
      ${e.retry?'<p style="margin-top:16px"><button onclick="load(true)" style="border:1px solid var(--border2);background:var(--bg3);border-radius:10px;padding:10px 18px;cursor:pointer">Try again</button></p>':''}</div>`;
    document.title='Shared board';
    return;
  }
  if(!VIEW) VIEW=pickDefaultView();
  const b=DATA.board;
  document.title=b.name+' · Shared board';
  const v = VIEW==='storyboard'?viewStoryboard():VIEW==='canvas'?viewCanvas():viewSections();
  const metaBits=[b.client, DATA.board.updatedAt?'Updated '+ago(DATA.board.updatedAt):''].filter(Boolean);
  const banner = FROM_CACHE
    ? `<div class="banner warn">You're offline — showing the copy saved ${esc(ago(DATA.fetchedAt))}. Tap ↻ to check for changes.</div>` : '';
  app.innerHTML=`
    <header id="hdr">
      <div class="row1"><div style="flex:1;min-width:0"><h1>${esc(b.name)}</h1><div class="meta">${esc(metaBits.join(' · '))}</div></div>
        <button id="refresh" onclick="load(true)" aria-label="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button></div>
      <div class="seg">${[['sections','Sections'],['storyboard','Storyboard'],['canvas','Canvas']].map(([k,l])=>`<button class="${VIEW===k?'on':''}" onclick="setView('${k}')">${l}</button>`).join('')}</div>
      ${v.jump.length?`<div id="jump">${v.jump.map(j=>`<button onclick="jumpTo('${j.id}')">${esc(j.title)}</button>`).join('')}</div>`:''}
    </header>
    ${v.canvas?banner:`${banner}<main>${v.html}<div class="foot">View-only link${DATA.expiresAt?' · expires '+esc(new Date(DATA.expiresAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})):''}</div></main>`}
    ${v.canvas?v.html:''}`;
  const h=document.getElementById('hdr'); document.documentElement.style.setProperty('--hdr-h',(h.offsetHeight+8)+'px');
  if(v.canvas) wireCanvas();
}
function jumpTo(id){
  const el=document.getElementById(id), h=document.getElementById('hdr'); if(!el) return;
  window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-(h?h.offsetHeight:0)+6),behavior:'smooth'});
}

document.addEventListener('click',e=>{
  const img=e.target.closest('main [data-lb]'); if(img){ openLightbox(img.dataset.lb); return; }
  const sw=e.target.closest('[data-copy]');
  if(sw){ const v=sw.dataset.copy; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied '+v),()=>toast(v)); }
});
window.addEventListener('resize',()=>{ if(VIEW==='canvas'){ const el=document.getElementById('canvas'), h=document.getElementById('hdr'); if(el&&h) el.style.top=h.getBoundingClientRect().bottom+'px'; } });

async function load(manual){
  const btn=document.getElementById('refresh'); if(btn) btn.classList.add('spin');
  if(!TOKEN){ LOAD_ERR={title:'Link not valid',message:'This address is missing its board code. Check the link you were sent.'}; DATA=null; render(); return; }
  try{
    const r=await fetch('/api/public/boards/'+encodeURIComponent(TOKEN),{cache:'no-store'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      // A dead link must not keep showing a saved copy
      if(r.status===404||r.status===410){ try{ localStorage.removeItem(CACHE_KEY); }catch(e){} }
      const title=r.status===410?'This link has expired':r.status===404?'Link not available':r.status===429?'Slow down a moment':'Board unavailable';
      if((r.status>=500||r.status===429) && DATA){ toast(d.error||'Could not refresh'); FROM_CACHE=true; render(); return; }
      LOAD_ERR={title,message:d.error||'This link could not be opened.',retry:r.status>=500||r.status===429}; DATA=null; render(); return;
    }
    DATA=d; FROM_CACHE=false; LOAD_ERR=null;
    lsSet(CACHE_KEY, JSON.stringify(d));
    render();
    if(manual) toast('Up to date');
    precacheImages();
  }catch(err){
    // Network failure: fall back to the last copy saved on this phone
    const saved=lsGet(CACHE_KEY);
    if(!DATA && saved){ try{ DATA=JSON.parse(saved); }catch(e){} }
    if(DATA){ FROM_CACHE=true; render(); if(manual) toast('Still offline'); }
    else { LOAD_ERR={title:"Can't reach the board",message:"You're offline and this board hasn't been opened on this phone before. Try again when you have signal.",retry:true}; render(); }
  }finally{ const b=document.getElementById('refresh'); if(b) b.classList.remove('spin'); }
}

// Offline support: a service worker keeps the page and the board's images so the
// link still opens on set with no signal.
function precacheImages(){
  if(!('serviceWorker' in navigator) || !DATA) return;
  const urls=DATA.items.map(i=>i.imageUrl).filter(Boolean);
  navigator.serviceWorker.ready.then(reg=>{ if(reg.active) reg.active.postMessage({type:'precache', urls}); }).catch(()=>{});
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/share-sw.js',{scope:'/b/'}).catch(()=>{}); }

// Show a saved copy instantly (if any), then fetch the live board
(function boot(){
  const saved=lsGet(CACHE_KEY);
  if(saved){ try{ DATA=JSON.parse(saved); FROM_CACHE=false; render(); }catch(e){ DATA=null; } }
  load(false);
})();
</script>
